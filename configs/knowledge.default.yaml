schema_version: "1"
paths:
  data_root: data/knowledge
  output_root: output/knowledge
database:
  path: data/knowledge/registry.sqlite
parsing:
  adapter: docling
  ocr_policy: auto
chunking:
  target_tokens: 450
  max_tokens: 800
  preserve_clause_context: true
extraction:
  provider: null
  model: null
  prompt_version: v1
  max_transport_attempts: 3
embedding:
  provider: null
  model: null
  dimension: null
retrieval:
  lexical_top_k: 20
  vector_top_k: 20
  rrf_k: 60
  allow_degraded: false
review:
  require_clause_approval: true
