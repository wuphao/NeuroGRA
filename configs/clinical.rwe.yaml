schema_version: "1"
patient_data_root: data/clinical/patients
database: data/clinical/clinical.sqlite
data_root: data/clinical
output_root: output/clinical
knowledge_config: configs/kg.local.yaml
text_knowledge_config: configs/kb.local.yaml
text_knowledge_release_id: null
max_rounds: 3
synthesis_reserved_calls: 6
model:
  provider: ollama
  base_url: http://localhost:11434
  model: qwen3.8:27b
  timeout_seconds: 180
  max_output_tokens: 4096
  context_tokens: 16384
  max_input_chars: 24000
  transport_attempts: 2
budget: {llm: 96, retrieval: 12, image: 2, patient_data: 12, embedding: 128, seconds: 2400}
task_budget: {max_llm_calls: 24, max_retrieval_calls: 2, timeout_seconds: 1200}
max_parallel_tasks: 2
verify_narrative: true
vector_enabled: true
vector:
  timeout_seconds: 60
