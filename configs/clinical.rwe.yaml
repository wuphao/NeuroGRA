schema_version: "1"
patient_data_root: data/clinical/patients
database: data/clinical/clinical.sqlite
data_root: data/clinical
output_root: output/clinical
knowledge_config: configs/knowledge.local.ollama_neo4j.example.yaml
model:
  provider: ollama
  base_url: http://localhost:11434
  model: qwen3.6:35b
  timeout_seconds: 180
  max_output_tokens: 4096
  context_tokens: 16384
  max_input_chars: 24000
  transport_attempts: 2
budget: {llm: 96, retrieval: 24, image: 2, seconds: 2400}
task_budget: {max_llm_calls: 24, max_retrieval_calls: 2, timeout_seconds: 1200}
max_parallel_tasks: 2
verify_narrative: true
vector_enabled: true
vector:
  base_url: http://localhost:11434
  model: bge-m3:latest
  dimension: 1024
  max_chars: 1800
  timeout_seconds: 60
  index_manifest: data/knowledge/vector_indexes/vector_f17bed05a0f4159c607f47e22235af51/manifest.json
  index_root: data/knowledge/vector_indexes
