<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>登录 · NeuroGRA</title><link rel="stylesheet" href="/login.css"><script src="/login.js" defer></script></head>
<body><main class="login-layout"><section class="login-identity"><a class="login-brand" href="/login"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M8 22V10l16 12V10M8 16h16"/><circle cx="8" cy="9" r="2.2"/><circle cx="24" cy="23" r="2.2"/></svg>NeuroGRA</a><div class="identity-copy"><span class="identity-line"></span><h1>从患者资料<br>到循证分析</h1><p>神经退行性疾病分析工作空间</p><div class="clinical-symbol" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div></div></section><section class="login-panel"><form id="login-form"><h2>登录工作空间</h2><p class="login-subtitle">使用 RWE 账号登录</p><label for="account">账号</label><input id="account" name="username" type="text" autocomplete="username" placeholder="请输入 RWE 账号" required maxlength="128"><label for="password">密码</label><div class="password-field"><input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required maxlength="512"><button id="toggle-password" type="button" aria-label="显示密码">显示</button></div><div id="login-error" role="alert" hidden></div><button id="login-submit" type="submit">登录</button></form></section></main></body></html>
