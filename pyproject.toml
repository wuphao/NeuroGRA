[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurogra"
version = "0.1.0"
description = "Graph-enhanced RAG and multi-agent assisted diagnosis research project for neurodegenerative diseases."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "neo4j>=5.20,<6",
    "pydantic>=2.8,<3",
    "pypdf>=5.0,<7",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
rwe = ["psycopg2-binary>=2.9,<3", "requests>=2.31,<3"]
clinical = ["openpyxl>=3.1,<4", "python-docx>=1.1,<2", "pydicom>=3,<4"]
clinical-imaging = ["SimpleITK>=2.3,<3"]

[tool.setuptools]
package-dir = {"" = "code"}

[tool.setuptools.packages.find]
where = ["code"]

[tool.pytest.ini_options]
testpaths = ["code"]
python_files = ["test_*.py", "*_test.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
