[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurogra"
version = "0.1.0"
description = "Graph-enhanced RAG and multi-agent assisted diagnosis research project for neurodegenerative diseases."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "neo4j>=5.20,<6",
    "pydantic>=2.8,<3",
    "pypdf>=5.0,<7",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["build>=1.2,<2", "ruff>=0.11,<1"]
rwe = ["psycopg2-binary>=2.9,<3", "requests>=2.31,<3"]
chat-migration = ["psycopg[binary]>=3.3,<4", "python-dotenv>=1.2,<2"]
clinical = ["openpyxl>=3.1,<4", "python-docx>=1.1,<2", "pydicom>=3,<4"]
clinical-imaging = ["SimpleITK>=2.3,<3"]
kg = ["numpy>=1.26,<3", "PyMuPDF>=1.24,<2"]
kb = ["numpy>=1.26,<3", "PyMuPDF>=1.24,<2"]

[project.scripts]
neurogra = "neurogra.platform.cli:main"

[tool.setuptools]
package-dir = {"" = "code"}

[tool.setuptools.packages.find]
where = ["code"]
include = ["neurogra*"]

[tool.setuptools.package-data]
"neurogra.platform" = ["static/*.html", "static/*.js", "static/*.css", "defaults/*.yaml"]
"neurogra.clinical" = ["report_template.md"]
neurogra_kg = ["prompts/*.txt", "prompts/*.json", "examples/*.json", "README.md"]
neurogra_kb = ["README.md"]

[tool.pytest.ini_options]
testpaths = ["code"]
python_files = ["test_*.py", "*_test.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
